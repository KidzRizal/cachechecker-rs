[package]
name = "cachechecker"
version = "2.1.0"
edition = "2021"
description = "Cek cache & total file di semua disk - GUI + TUI interaktif + CLI + report"
default-run = "cachechecker"

[lib]
name = "cachechecker"
path = "src/lib.rs"

[[bin]]
name = "cachechecker"
path = "src/main.rs"

[[bin]]
name = "cachechecker-gui"
path = "src/bin/gui.rs"

[dependencies]
anyhow = "1"
chrono = "0.4"
clap = { version = "4.5", features = ["derive"] }
ctrlc = "3.4"
glob = "0.3"
indicatif = "0.17"
ratatui = "0.29"
rayon = "1.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "0.31", default-features = false, features = ["default_fonts", "glow", "persistence", "wayland", "x11"] }
egui_extras = { version = "0.31" }
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
